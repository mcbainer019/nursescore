<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NurseScore - ATS Resume Analyzer for Nurses</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #FAFAF8; color: #2D2520; }
        
        .header {
            background: white;
            border-bottom: 1px solid #E8DFD3;
            padding: 16px 24px;
        }
        .header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-family: 'Georgia', serif; font-size: 24px; font-weight: 400; letter-spacing: -0.5px; }
        .tagline { font-size: 11px; color: #7A6F68; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
        
        .hero {
            background: #FFFBF5;
            border-bottom: 1px solid #E8DFD3;
            padding: 48px 24px;
        }
        .hero-content { max-width: 800px; margin: 0 auto; }
        .hero h1 { font-family: 'Georgia', serif; font-size: 42px; margin-bottom: 16px; line-height: 1.2; font-weight: 400; letter-spacing: -0.5px; }
        .hero p { font-size: 15px; color: #7A6F68; max-width: 500px; line-height: 1.6; }
        
        .container { max-width: 800px; margin: 32px auto; padding: 0 16px; }
        
        .card {
            background: white;
            border: 1px solid #E8DFD3;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(45, 37, 32, 0.04);
        }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 500; font-size: 13px; color: #2D2520; margin-bottom: 6px; }
        textarea, input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #E8DFD3;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            color: #2D2520;
            background: #FAFAF8;
            resize: vertical;
            line-height: 1.5;
        }
        textarea:focus, input:focus { outline: none; border-color: #D4A574; }
        textarea { min-height: 200px; }
        
        button {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #D4A574;
            color: white;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { background: #8B6F47; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .error { background: #FAF3F0; border: 1px solid #EDD5CE; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: #A85448; font-size: 13px; }
        .success { background: #F0F5EA; border: 1px solid #C9DDB8; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: #6B8E5F; font-size: 13px; }
        
        .spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 50px 0;
        }
        .spinner-ring {
            width: 44px;
            height: 44px;
            border: 2px solid #E8DFD3;
            border-top: 2px solid #D4A574;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .score-result {
            background: #FAFAF8;
            border: 1px solid #E8DFD3;
            border-radius: 10px;
            padding: 20px 22px;
            margin-bottom: 24px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .score-ring { font-size: 48px; min-width: 100px; text-align: center; }
        .score-text { flex: 1; }
        .verdict { font-weight: 600; font-size: 12px; color: #D4A574; border-bottom: 2px solid #D4A574; display: inline-block; padding-bottom: 2px; margin-bottom: 8px; }
        .score-result p { color: #2D2520; font-size: 14px; margin: 0; line-height: 1.6; font-weight: 500; }
        
        .category-bar {
            margin-bottom: 14px;
            background: white;
            border-radius: 10px;
            border: 1px solid #E8DFD3;
            padding: 14px 16px;
        }
        .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .category-label { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 14px; }
        .category-score { font-weight: 600; font-size: 13px; color: #D4A574; background: #EDE4D6; padding: 3px 10px; border-radius: 16px; }
        .progress-bar { background: #E8DFD3; border-radius: 3px; height: 5px; }
        .progress-fill { background: #D4A574; height: 100%; border-radius: 3px; transition: width 0.8s; }
        
        .tab-buttons { display: flex; gap: 6px; margin-bottom: 20px; }
        .tab-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            font-size: 13px;
            background: transparent;
            color: #7A6F68;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #EDE4D6;
            color: #2D2520;
            border-bottom: 2px solid #D4A574;
        }
        
        .pro-box {
            background: #FAFAF8;
            border: 1px solid #E8DFD3;
            border-radius: 10px;
            padding: 20px 18px;
            margin-top: 20px;
        }
        .pro-box h3 { font-family: 'Georgia', serif; font-size: 16px; color: #2D2520; font-weight: 400; margin-bottom: 6px; letter-spacing: -0.3px; }
        .pro-features { list-style: none; margin-bottom: 12px; }
        .pro-features li { font-size: 12px; color: #7A6F68; margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
        
        .footer { text-align: center; padding: 24px; border-top: 1px solid #E8DFD3; margin-top: 32px; color: #7A6F68; font-size: 12px; }
        
        .big-win { background: #EDE4D6; border: 1px solid #E8DFD3; border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; display: flex; gap: 12px; align-items: flex-start; }
        .big-win-icon { font-size: 18px; flex-shrink: 0; }
        .big-win-label { font-weight: 700; font-size: 12px; color: #8B6F47; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
        .big-win-text { font-size: 13px; color: #2D2520; line-height: 1.5; font-weight: 500; }
        
        .keywords { margin-bottom: 20px; }
        .keywords-title { font-weight: 600; font-size: 12px; color: #2D2520; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .keywords-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .keyword-tag { background: #FEF3E8; border: 1px solid #C49060; color: #C49060; border-radius: 16px; padding: 4px 11px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;
        
        function NurseScore() {
            const [resume, setResume] = useState('');
            const [jobDesc, setJobDesc] = useState('');
            const [email, setEmail] = useState('');
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [scansUsed, setScansUsed] = useState(0);
            const [activeTab, setActiveTab] = useState('score');
            
            async function analyzeResume() {
                if (!resume.trim()) {
                    setError('Please paste your resume text first.');
                    return;
                }
                if (scansUsed >= 1) {
                    setError("You've used your free scan. Upgrade to Pro for unlimited analysis.");
                    return;
                }
                setError('');
                setLoading(true);
                setResult(null);
                
                try {
                    const response = await fetch('/api/analyze', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            resume: resume.trim(),
                            jobDescription: jobDesc.trim()
                        })
                    });
                    
                    const parsed = await response.json();
                    if (!response.ok) {
                        setError(parsed.error || 'Error analyzing resume');
                        setLoading(false);
                        return;
                    }
                    setResult(parsed);
                    setScansUsed(s => s + 1);
                } catch (e) {
                    setError('Error analyzing resume. Please try again.');
                    console.error(e);
                } finally {
                    setLoading(false);
                }
            }
            
            const getVerdictColor = (score) => {
                if (score >= 80) return '#6B8E5F';
                if (score >= 60) return '#C49060';
                return '#A85448';
            };
            
            const getScoreEmoji = (score) => {
                if (score >= 80) return '✓';
                if (score >= 60) return '⚠';
                return '✗';
            };
            
            return (
                <div>
                    <div className="header">
                        <div className="header-content">
                            <div>
                                <div className="logo">NurseScore</div>
                                <div className="tagline">ATS Resume Analyzer</div>
                            </div>
                            <button style={{ width: 'auto', padding: '7px 14px', fontSize: '12px' }}>
                                Pro — $9/mo
                            </button>
                        </div>
                    </div>
                    
                    {!result && !loading && (
                        <div className="hero">
                            <div className="hero-content">
                                <h1>Does your resume make it past the filter?</h1>
                                <p>Most nursing resumes get rejected by hospital ATS systems before a human ever sees them. Paste yours and find out why — with nursing-specific fixes in 30 seconds.</p>
                            </div>
                        </div>
                    )}
                    
                    <div className="container">
                        <div className="card">
                            {!result && !loading && (
                                <>
                                    <div className="tab-buttons">
                                        <button className={`tab-btn ${activeTab === 'score' ? 'active' : ''}`} onClick={() => setActiveTab('score')}>Analyze</button>
                                        <button className={`tab-btn ${activeTab === 'how' ? 'active' : ''}`} onClick={() => setActiveTab('how')}>How it Works</button>
                                    </div>
                                    
                                    {activeTab === 'score' && (
                                        <>
                                            <div className="form-group">
                                                <label>Your Resume <span style={{ color: '#A85448' }}>*</span></label>
                                                <textarea value={resume} onChange={e => setResume(e.target.value)} placeholder="Paste your full resume here..." />
                                            </div>
                                            
                                            <div className="form-group">
                                                <label>Job Description <span style={{ color: '#7A6F68', fontWeight: 400 }}>(optional)</span></label>
                                                <textarea value={jobDesc} onChange={e => setJobDesc(e.target.value)} placeholder="Paste the job posting you're applying to..." />
                                            </div>
                                            
                                            {error && <div className="error">{error}</div>}
                                            
                                            <button onClick={analyzeResume} disabled={!resume.trim()}>
                                                Analyze My Resume
                                            </button>
                                            <p style={{ textAlign: 'center', fontSize: '12px', color: '#7A6F68', marginTop: '10px' }}>
                                                Free analysis. No sign-up. Results in ~30 seconds.
                                            </p>
                                        </>
                                    )}
                                    
                                    {activeTab === 'how' && (
                                        <div>
                                            {[
                                                ['🏥', 'Hospital ATS Logic', 'We analyze using the same criteria used by iCIMS, Taleo, and Workday—the systems used by 97% of US hospitals.'],
                                                ['📋', 'Six Dimensions', 'Certifications, EHR systems, clinical keywords, specialty alignment, formatting, and measurable impact.'],
                                                ['⚡', 'Specific, Not Generic', 'You get exact fixes like "Add your BLS expiry date in this format: BLS — American Heart Association — Exp. 03/2027".'],
                                                ['🔒', 'Private & Secure', 'Your resume is never stored. Analysis happens in-session and is deleted immediately.']
                                            ].map(([icon, title, desc], i) => (
                                                <div key={i} style={{ display: 'flex', gap: 12, marginBottom: 18 }}>
                                                    <div style={{ fontSize: 20, flexShrink: 0 }}>{icon}</div>
                                                    <div>
                                                        <div style={{ fontWeight: 600, fontSize: 13, color: '#2D2520', marginBottom: 4 }}>{title}</div>
                                                        <div style={{ fontSize: 13, color: '#7A6F68', lineHeight: 1.5 }}>{desc}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </>
                            )}
                            
                            {loading && (
                                <div className="spinner">
                                    <div className="spinner-ring"></div>
                                    <p style={{ color: '#7A6F68', fontSize: 13, margin: 0 }}>Analyzing your resume…</p>
                                </div>
                            )}
                            
                            {result && (
                                <>
                                    <div className="score-result">
                                        <div className="score-ring">{getScoreEmoji(result.overall)} {result.overall}</div>
                                        <div className="score-text">
                                            <div className="verdict" style={{ color: getVerdictColor(result.overall), borderBottomColor: getVerdictColor(result.overall) }}>
                                                {result.overall >= 80 ? 'Strong ATS Match' : result.overall >= 60 ? 'Needs Improvement' : 'At Risk'}
                                            </div>
                                            <p>{result.verdict}</p>
                                        </div>
                                    </div>
                                    
                                    {result.biggest_win && (
                                        <div className="big-win">
                                            <span className="big-win-icon">⭐</span>
                                            <div>
                                                <div className="big-win-label">Biggest Impact</div>
                                                <div className="big-win-text">{result.biggest_win}</div>
                                            </div>
                                        </div>
                                    )}
                                    
                                    {result.top_missing_keywords?.length > 0 && (
                                        <div className="keywords">
                                            <div className="keywords-title">🔑 Missing Keywords</div>
                                            <div className="keywords-list">
                                                {result.top_missing_keywords.map((kw, i) => (
                                                    <span key={i} className="keyword-tag">{kw}</span>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div style={{ marginBottom: 20 }}>
                                        <div style={{ fontWeight: 600, fontSize: 12, color: '#2D2520', marginBottom: 12, textTransform: 'uppercase', letterSpacing: '0.05em' }}>Score Breakdown</div>
                                        {Object.entries(result.categories).map(([key, val]) => (
                                            <div key={key} className="category-bar">
                                                <div className="category-header">
                                                    <div className="category-label">
                                                        <span>{['certifications', 'ehr_tech', 'clinical_keywords', 'specialty_alignment', 'formatting', 'impact_language'].indexOf(key) === 0 ? '🏅' : key === 'ehr_tech' ? '💻' : key === 'clinical_keywords' ? '🩺' : key === 'specialty_alignment' ? '🎯' : key === 'formatting' ? '📄' : '📈'}</span>
                                                        <span>
                                                            {key === 'certifications' ? 'Certifications & Licensure' : key === 'ehr_tech' ? 'EHR & Technology' : key === 'clinical_keywords' ? 'Clinical Keywords' : key === 'specialty_alignment' ? 'Specialty Alignment' : key === 'formatting' ? 'ATS Formatting' : 'Impact & Outcomes'}
                                                        </span>
                                                    </div>
                                                    <div className="category-score">{val.score}</div>
                                                </div>
                                                <div className="progress-bar">
                                                    <div className="progress-fill" style={{ width: `${val.score}%` }} />
                                                </div>
                                                {val.issues?.length > 0 && (
                                                    <ul style={{ margin: '8px 0 0 0', padding: 0, listStyle: 'none' }}>
                                                        {val.issues.slice(0, 3).map((issue, i) => (
                                                            <li key={i} style={{ display: 'flex', gap: 8, alignItems: 'flex-start', marginBottom: 5 }}>
                                                                <span style={{ color: '#7A6F68', fontWeight: 600, fontSize: 12, marginTop: 2, opacity: 0.6 }}>→</span>
                                                                <span style={{ fontSize: 13, color: '#7A6F68', lineHeight: 1.4 }}>{issue}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    
                                    <div className="pro-box">
                                        <h3>⭐ Unlimited Scanning</h3>
                                        <ul className="pro-features">
                                            <li><span style={{ color: '#D4A574' }}>✓</span> Unlimited rescans</li>
                                            <li><span style={{ color: '#D4A574' }}>✓</span> Rewrite suggestions</li>
                                            <li><span style={{ color: '#D4A574' }}>✓</span> Cover letter generator</li>
                                            <li><span style={{ color: '#D4A574' }}>✓</span> Specialty modes (ICU, ER, L&D)</li>
                                        </ul>
                                        {error && <div className="error">{error}</div>}
                                        <div className="form-group">
                                            <label>Email <span style={{ color: '#A85448' }}>*</span></label>
                                            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="your@email.com" />
                                        </div>
                                        <button onClick={() => alert('Stripe integration coming soon.')}>
                                            Subscribe to Pro — $9/month
                                        </button>
                                        <p style={{ fontSize: '11px', color: '#7A6F68', marginTop: 8, marginBottom: 0, textAlign: 'center' }}>
                                            Cancel anytime. Secure payment via Stripe.
                                        </p>
                                    </div>
                                    
                                    <button onClick={() => { setResult(null); setResume(''); setJobDesc(''); setEmail(''); setError(''); }} style={{ marginTop: 12, background: 'transparent', color: '#7A6F68', border: `1px solid #E8DFD3` }}>
                                        ← Analyze another resume
                                    </button>
                                </>
                            )}
                        </div>
                        
                        {!result && !loading && (
                            <div style={{ display: 'flex', justifyContent: 'center', gap: 20, marginTop: 20, flexWrap: 'wrap', fontSize: 12, color: '#7A6F68' }}>
                                <span>🔒 Your data is private</span>
                                <span>📊 97% of hospitals use our criteria</span>
                                <span>✓ Trusted by nurses</span>
                            </div>
                        )}
                    </div>
                    
                    <div className="footer">
                        <p>NurseScore © 2026 · Built for nurses, not recruiters</p>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<NurseScore />, document.getElementById('root'));
    </script>
</body>
</html>
